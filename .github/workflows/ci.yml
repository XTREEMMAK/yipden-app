# Typecheck, lint, unit tests and the static build.
#
# Actions are pinned to commit SHAs rather than tags: a tag is mutable, and a workflow that
# trusts one is trusting whoever can move it. pnpm comes from corepack, driven by the
# packageManager field in package.json, so there is no fourth action to pin and no way for the
# version here to drift from the one in use locally.
#
# For this to block a merge it has to be marked required in Settings, Branches. A workflow
# file cannot express that.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # A lockfile that disagrees with the manifests fails here rather than producing a build
      # from dependencies nobody chose.
      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint and formatting
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
