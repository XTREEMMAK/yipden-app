<!doctype html>
<html lang="en" data-theme="system" data-skin="original">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover so the app can paint under the status bar and read safe areas. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
		/>
		<meta name="referrer" content="strict-origin-when-cross-origin" />
		<meta name="color-scheme" content="light dark" />
		<meta name="description" content="A reader for the indie web. Follow people, not platforms." />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<!--
			Set the theme before first paint. Without this the app renders light and then flips,
			which is the one flash a reader would notice on every single launch.
		-->
		<script src="%sveltekit.assets%/theme-init.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
