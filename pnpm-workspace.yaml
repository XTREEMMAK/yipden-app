packages:
  - 'apps/*'
  - 'packages/*'

# esbuild ships a prebuilt binary its postinstall puts in place; vitest needs it.
allowBuilds:
  esbuild: true

patchedDependencies:
  '@capgo/capacitor-inappbrowser@8.21.1': patches/@capgo__capacitor-inappbrowser@8.21.1.patch
  '@capgo/capacitor-media-session@8.0.32': patches/@capgo__capacitor-media-session@8.0.32.patch
